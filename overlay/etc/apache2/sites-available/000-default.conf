# The default site of the web stack: one document root, /var/www/, on both
# ports. Debian's own 000-default.conf serves /var/www/html; LAMP and LAPP
# both replace it with this, so it belongs to the layer they share. Each may
# still ship its own copy of this file, because a recipe's overlay is applied
# after this one.
#
# Taken from the two upstream recipes, which carry the same file with
# different indentation. The one difference between them, LAMP's
# "Header always unset Upgrade", is not here: LAMP also ships
# conf-available/remove-upgrade-header.conf and enables it, so it is LAMP's
# and not the stack's.
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/
</VirtualHost>

<Directory /var/www/>
    Options Indexes FollowSymLinks MultiViews
    Require all granted
</Directory>
